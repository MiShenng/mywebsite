<style>
  /* 极简高级感 Footer 样式 */
  .custom-footer {
    text-align: center;
    padding: 20px 0 40px;
  }

  .footer-copyright {
    color: #666666;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>

<footer class="custom-footer">
  {{ partial "comments.html" . }}
  {{ partial "foot_custom.html" . }}

  <div class="footer-copyright">
    &copy; Lizao {{ .Site.Params.copyrightStartYear }}—<span id="copyright-current-year">{{ now.Year }}</span>
  </div>

  <script>
    document.getElementById('copyright-current-year').textContent = new Date().getFullYear();
  </script>

</footer>
